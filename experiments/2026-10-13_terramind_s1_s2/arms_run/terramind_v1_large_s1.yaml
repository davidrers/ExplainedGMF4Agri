# TerraMind v1 large, frozen, on the twelve monthly Sentinel-1 RTC composites alone (VV, VH in dB), registered by
# run.py; ChannelBottleneck and the 12.9 M parameter UNet decoder of the S2 arm, fitted from cached features.
# Everything else as configs/arms/terramind_v1_large.yaml.
route: cache                   # cache: fitted from cached encoder features; raster: from embedding rasters
data:
  normalisation: backbone      # TerraMind v1 S1RTC pretraining statistics
  batch_size: 2                # with accumulate_grad_batches 2, an effective batch of 4
  augment: true                # D4; the cached fit draws one of the eight cached variants
model:
  backbone: terramind_v1_large_s1
  lr: 1.0e-4
  weight_decay: 0.05
  head_dropout: 0.1
  loss: ce
trainer:
  precision: 16-mixed
  log_every_n_steps: 10
  accumulate_grad_batches: 2
# One modality of two bands: the S2 arm's encoding batch.
encode_batch_size: {hub: 4, cluster: 16}
