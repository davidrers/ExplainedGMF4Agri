# The baseline as PRUE: smp's U-Net with an EfficientNet-B7 encoder from ImageNet (user, 9 November 2026), in place of
# the main workflow's ResNet-18 U-Net from scratch, on the same input: the 12 monthly S2 composites (12 bands) and S1
# composites (VV, VH) stacked on 168 channels, under the chip set's statistics, everything trained end to end. Two
# heads (heads.UNetJoint): the border head on the U-Net's 16 features, the crop MLP on the 168 channels and those
# features, as the 10 m arms. Read by this folder's run.py, not by the K-shot runner; in arms_run/ for that reason.
kshot_arm: unet_r18_scratch_s2s1   # the main workflow's baseline: its inputs, normalisation (chips), batch
input: stack
data: {batch_size: 4, eval_batch_size: 8, augment: true}
unet: {encoder: efficientnet-b7, weights: imagenet}        # PRUE; the first convolution widened to 168 channels
crop: {hidden: [512, 256], dropout: 0.2, head_dropout: 0.1}   # the 10 m arms' MLP; the baseline's head_dropout
optim:
  unet: {lr: 3.0e-3, weight_decay: 0.01, amsgrad: true, schedule: cosine, min_lr: 1.0e-6}        # PRUE
  crop_head: {lr: 1.0e-3, weight_decay: 0.05, amsgrad: false, schedule: cosine, min_lr: 3.33e-7}  # the baseline's
