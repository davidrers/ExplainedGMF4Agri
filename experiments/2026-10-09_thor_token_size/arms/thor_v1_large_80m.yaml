# THOR v1 large, frozen, on 80 m tokens (patch 8 on the 10 m bands, 4 on the 20 m bands), a 28 x 28 grid.
# The arm of experiments/2026-10-08_thor_80m with the batch of configs/arms/thor_v1_large.yaml (2, accumulated
# twice), so that the three arms of this study differ only in the token size. 4 px is the smallest patch THOR
# was pretrained with. About 154 MB per chip encoding.
route: cache                   # cache: fitted from cached encoder features; raster: from embedding rasters
data:
  normalisation: backbone      # THOR pretraining statistics
  batch_size: 2                # with accumulate_grad_batches 2, an effective batch of 4
  augment: true                # D4; the cached fit draws one of the eight cached variants
model:
  backbone: thor_v1_large_80m
  lr: 1.0e-4
  weight_decay: 0.05
  head_dropout: 0.1
  loss: ce
trainer:
  precision: 16-mixed
  log_every_n_steps: 10
  accumulate_grad_batches: 2
encode_batch_size: {hub: 1, cluster: 4}   # chips per encoding batch; the core profiles do not know this arm
