    Portugal:
    - -31.5
    - -6.1
    - 32.3
    - 42.3
  non_crop_and_catch_all_codes:
  - hcat: '3399000000'
    crop_name: not known and other
    reason: not known and other; a level-3 catch-all that also absorbs national declarations
      with no HCAT equivalent, including landscape features
  - hcat: '3301990000'
    crop_name: other arable land crops
    reason: other arable land crops; a catch-all for mixed and unresolved arable declarations
  - hcat: '3301110000'
    crop_name: fallow land not crop
    reason: fallow land, a land status rather than a crop
  - hcat: '3301011500'
    crop_name: unspecified cereals
    reason: unspecified cereals; species unresolved
  - hcat: '3301019900'
    crop_name: other cereals
    reason: other cereals; species unresolved
  - hcat: '3301069900'
    crop_name: other industrial crops
    reason: other industrial non-food crops; a catch-all
  - hcat: '3303990000'
    crop_name: other permanent crops plantations
    reason: other permanent crops; a catch-all within permanent crops
  - hcat: '3303120000'
    crop_name: unspecified permanent crops
    reason: unspecified permanent crops; declared as mixed permanent cultures
  - hcat: '3303080700'
    crop_name: wire bush
    reason: wire bush; the Portuguese declarations behind it are hedges, windbreaks
      and non-grazable shrub, that is landscape features rather than a crop
  - hcat: '3305000000'
    crop_name: greenhouse foil film
    reason: greenhouse, foil and film; a structure rather than a crop
  - hcat: '3304000000'
    crop_name: mushrooms energy genetically modified crops
    reason: mushrooms, energy and genetically modified crops; a heterogeneous residual
  - hcat: '3300000000'
    crop_name: crop type
    reason: crop type; a taxonomy root, uninformative as a label
  - hcat: '3000000000'
    crop_name: characteristics
    reason: characteristics; a taxonomy root, uninformative as a label
  excluded_branches_by_prefix:
  - prefix: '3306'
    reason: tree, wood and forest; forestry rather than an agricultural crop
  borderline_may_be_reinstated:
  - hcat: '3306060000'
    crop_name: oak
    note: oak; the Portuguese declarations are cork and holm oak plantations, that
      is montado silvo-pastoral systems, which are agriculturally managed even though
      the HCAT branch is forestry
  - hcat: '3301110000'
    crop_name: fallow land not crop
    note: fallow land; a legitimate class if the task is framed as land use rather
      than crop type, and it is the third largest Latvian class
