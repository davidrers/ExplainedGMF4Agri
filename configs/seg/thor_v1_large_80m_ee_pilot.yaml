# THOR on 80 m tokens, the token-size ablation of thor_v1_large_ee_pilot.yaml: identical but
# for the patch sizes (8 and 4 px instead of 16 and 8), so the decoder sees a 28 x 28 grid.
# A pipeline test, not a Phase 1 result: the pilot has no block split and no test chips,
# so "test" metrics are computed on the validation chips.
# THOR comes from its TerraTorch extension; install it with scripts/env/install_thor.sh.
run_name: thor_v1_large_80m_ee_pilot
seed: 0

data:
  root: data/eurocrops_chips/EE_2021_pilot
  normalisation: backbone      # backbone = THOR pretraining stats; chips = manifest stats
  batch_size: 1                # 80 m tokens: 1,568 per month, four times the 160 m grid
  num_workers: 4
  augment: true                # D4 on the training chips

label_budget:
  mode: dense                  # dense | pct
  pct: 5                       # per cent of the training parcels of each class, when mode is pct
  draw_seed: 0

model:
  backbone: thor_v1_large_80m
  lr: 1.0e-4
  weight_decay: 0.05
  head_dropout: 0.1
  loss: ce

trainer:
  max_epochs: 40
  precision: 16-mixed
  log_every_n_steps: 1
  accumulate_grad_batches: 4   # effective batch 4, as in the other pilot runs

output_root: results/seg
