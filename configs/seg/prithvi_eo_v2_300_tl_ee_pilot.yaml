# Pilot wiring of Prithvi-EO-2.0 300M TL to the EuroCrops chips: frozen encoder, trainable UNet decoder.
# A pipeline test, not a Phase 1 result: the pilot has no block split and no test chips,
# so "test" metrics are computed on the validation chips.
run_name: prithvi_eo_v2_300_tl_ee_pilot
seed: 0

data:
  root: data/eurocrops_chips/EE_2021_pilot
  normalisation: backbone      # backbone = Prithvi-EO-2.0 HLS pretraining stats; chips = manifest stats
  batch_size: 4
  num_workers: 4
  augment: true                # albumentations D4 on the training chips

label_budget:
  mode: dense                  # dense | pct
  pct: 5                       # per cent of the training parcels of each class, when mode is pct
  draw_seed: 0

model:
  backbone: prithvi_eo_v2_300_tl
  lr: 1.0e-4
  weight_decay: 0.05
  head_dropout: 0.1
  loss: ce

trainer:
  max_epochs: 40
  precision: 16-mixed
  log_every_n_steps: 1

output_root: results/seg
