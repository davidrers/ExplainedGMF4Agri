# Full-country Estonia 2021: AlphaEarth Foundations annual embeddings (Google Satellite Embedding
# V1, 64-d) with the per-pixel MLP head of the TESSERA arm (two hidden layers, 512 and 256), on
# the spatial block split. No encoder runs: the embedding rasters from
# scripts/data/build_alphaearth_chips.py are the features. Every hyperparameter matches
# tessera_v1_mlp_ee, so the two precomputed embeddings differ only in the embedding.
run_name: alphaearth_v1_mlp_ee
seed: 0

data:
  root: data/eurocrops_chips/EE_2021
  split: data/eurocrops_chips/EE_2021/splits/blocks4_buf1600_seed0__6b0eb4cb
  normalisation: chips         # embeddings have no pretraining stats; training-chip stats either way
  batch_size: 4
  num_workers: 16
  augment: true                # D4 is exact for a per-pixel embedding

label_budget:
  mode: pct                    # dense | pct; under a split, dense is the 100 % draw
  pct: 100
  draw_seed: 0

model:
  backbone: alphaearth_v1
  lr: 1.0e-3                   # a small head trained from scratch; the token-grid runs use 1e-4
  weight_decay: 0.05
  head_dropout: 0.2
  loss: ce

trainer:
  max_epochs: 40
  precision: 16-mixed
  log_every_n_steps: 10

output_root: results/seg
