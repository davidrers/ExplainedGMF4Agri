# Full-country Estonia 2021: TESSERA v1 precomputed embeddings with a per-pixel MLP head (two
# hidden layers, 512 and 256), on the spatial block split. No encoder runs: the embedding
# rasters from scripts/data/build_tessera_chips.py are the features. Pixels outside the store's
# coverage or with a rejected scale enter as zero (0.66 % of labelled test pixels).
run_name: tessera_v1_mlp_ee
seed: 0

data:
  root: data/eurocrops_chips/EE_2021
  split: data/eurocrops_chips/EE_2021/splits/blocks4_buf1600_seed0__6b0eb4cb
  normalisation: chips         # embeddings have no pretraining stats; training-chip stats either way
  batch_size: 4
  num_workers: 16
  augment: true                # D4 is exact for a per-pixel embedding

label_budget:
  mode: pct                    # dense | pct; under a split, dense is the 100 % draw
  pct: 100
  draw_seed: 0

model:
  backbone: tessera_v1
  lr: 1.0e-3                   # a small head trained from scratch; the token-grid runs use 1e-4
  weight_decay: 0.05
  head_dropout: 0.2
  loss: ce

trainer:
  max_epochs: 40
  precision: 16-mixed
  log_every_n_steps: 10

output_root: results/seg
